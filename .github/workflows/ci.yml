name: testy

# Uruchamia testy przy każdym pushu i przy każdym pull requeście.
# Dzięki temu widać na GitHubie, czy projekt jest zielony — a jeśli coś
# zepsuje walidatory torów albo walidację danych od klienta, dowiemy się od razu.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Uruchom testy
        run: pytest tests/ -v
